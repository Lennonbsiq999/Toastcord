services:
  toastcord:
    build: .
    image: toastcord:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      TOASTCORD_DATA_DIR: /data
      COOKIE_SECURE: "false"
      TURN_URLS: ${TURN_URLS:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
    volumes:
      - toastcord-data:/data
volumes:
  toastcord-data:
