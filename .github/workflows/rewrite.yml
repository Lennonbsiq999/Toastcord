name: Install standalone Toastcord rewrite

on:
  push:
    branches: [main]
    paths:
      - ".toastcord-rewrite/**"
      - ".github/workflows/rewrite.yml"

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore, test, and replace the old source
        shell: bash
        run: |
          set -euo pipefail
          cat .toastcord-rewrite/part-* > /tmp/toastcord-source.tar.gz.b64
          base64 --decode /tmp/toastcord-source.tar.gz.b64 > /tmp/toastcord-source.tar.gz
          gzip -t /tmp/toastcord-source.tar.gz
          tar -tzf /tmp/toastcord-source.tar.gz
          tar -xzf /tmp/toastcord-source.tar.gz -C .
          rm -rf .toastcord-rewrite backend src
          rm -f appdeploy.auth-login.json index.html postcss.config.js tailwind.config.js tsconfig.json vite.config.ts tests/tests.json
          rm -f .github/workflows/rewrite.yml
          mkdir -p .github/workflows
          cat > .github/workflows/ci.yml <<'EOF'
          name: Toastcord CI
          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]
          permissions:
            contents: read
          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - run: npm run check
                - run: npm test
          EOF
          npm run check
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rewrite Toastcord as standalone Node application"
          git push origin HEAD:main
